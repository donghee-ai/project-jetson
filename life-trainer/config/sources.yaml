# Life Trainer — 웹 수집 소스 목록
#
# 규칙:
#   - RSS/Atom/API 가 있는 곳만 넣는다. HTML 스크레이핑 대상은 넣지 않는다.
#   - 모든 URL 은 `curl -sL -o /dev/null -w '%{http_code} %{content_type}'` 로 실제
#     200 + xml 계열을 **직접 확인한 것만** 넣는다. 확인 못 한 것은 "미검증" 주석을 남긴다.
#   - kind: rss|atom  -> feeds.py 가 feedparser 로 URL 을 직접 가져온다.
#     kind: arxiv      -> url 은 실제 주소가 아니라 arXiv 쿼리 문자열이다.
#   - interval_sec: 뉴스성 1시간, 블로그/릴리스/논문 6시간. http.py 의 적응형 로직이
#     곧 알아서 조정하므로 여기 값은 최초 추정치일 뿐이다.
#   - respect_robots: 기본 true. arXiv 만 false 다 (공식 API 인데 robots 가 전 경로를 막는다).
#   - ★ enabled: false 로 두면 수집을 멈춘다. **목록에서 지우는 것만으로는 안 멈춘다** —
#     `load_sources` 는 upsert 라 DB 행이 살아 있기 때문이다.
#
# ── 2026-08-23 개편 ────────────────────────────────────────────────────
# AI 15 · ML 15 로 다시 짰다. 같은 분야 안에서 **서로 다른 갈래**를 고른다 —
# 예전 목록은 OpenAI 블로그 1,144건 · HF 848건이 전체의 절반이라 한쪽으로 쏠려 있었다.
#   AI = 제품·응용·엣지·산업이 무엇을 내놓는가
#   ML = 연구·학습기법·도구가 어떻게 바뀌는가
# 검증일 2026-08-23. 아래 30개 중 28개는 직접 200 을 확인했고, 2개는 arXiv 레이트
# 제한에 걸려 이번에 확인하지 못했다(미검증 표시).

version: 1

sources:
  # ══════════════ AI — 제품 · 응용 · 엣지 · 산업 (15) ══════════════

  # ── 연구소·기업이 내놓는 것 ──
  - {kind: rss, name: "OpenAI News", url: "https://openai.com/news/rss.xml",
     tags: "ai,lab,product", interval_sec: 21600}
  - {kind: rss, name: "Google DeepMind Blog", url: "https://deepmind.google/blog/rss.xml",
     tags: "ai,lab,research", interval_sec: 21600}
  - {kind: rss, name: "Apple Machine Learning", url: "https://machinelearning.apple.com/rss.xml",
     tags: "ai,on-device,apple", interval_sec: 21600}
  - {kind: rss, name: "Meta Engineering", url: "https://engineering.fb.com/feed/",
     tags: "ai,systems,scale", interval_sec: 21600}

  # ── 추론 엔진 (이 기기에서 직접 쓰는 것) ──
  - {kind: atom, name: "llama.cpp 릴리스", url: "https://github.com/ggml-org/llama.cpp/releases.atom",
     tags: "ai,inference,gguf,on-device", interval_sec: 21600}
  - {kind: atom, name: "Ollama 릴리스", url: "https://github.com/ollama/ollama/releases.atom",
     tags: "ai,inference,local", interval_sec: 21600}
  - {kind: atom, name: "vLLM 릴리스", url: "https://github.com/vllm-project/vllm/releases.atom",
     tags: "ai,inference,serving", interval_sec: 21600}
  - {kind: atom, name: "whisper.cpp 릴리스", url: "https://github.com/ggml-org/whisper.cpp/releases.atom",
     tags: "ai,speech,on-device", interval_sec: 21600}

  # ── 엣지·젯슨 (이 기기 자체) ──
  - {kind: atom, name: "NVIDIA Developer Blog", url: "https://developer.nvidia.com/blog/feed",
     tags: "ai,edge,jetson,cuda", interval_sec: 21600}
  - {kind: rss, name: "NVIDIA Jetson 개발자 포럼", url: "https://forums.developer.nvidia.com/c/agx-autonomous-machines/jetson-embedded-systems/70.rss",
     tags: "ai,jetson,forum,embedded", interval_sec: 3600}

  # ── 산업·정책·로보틱스 ──
  - {kind: rss, name: "IEEE Spectrum - AI", url: "https://spectrum.ieee.org/feeds/topic/artificial-intelligence.rss",
     tags: "ai,industry,policy", interval_sec: 21600}
  - {kind: rss, name: "IEEE Spectrum - Robotics", url: "https://spectrum.ieee.org/feeds/topic/robotics.rss",
     tags: "ai,robotics,industry", interval_sec: 21600}

  # ── 커뮤니티·현장 ──
  - {kind: rss, name: "Hacker News (프론트페이지)", url: "https://hnrss.org/frontpage",
     tags: "ai,news,community", interval_sec: 3600}
  - {kind: rss, name: "GeekNews (한국 IT)", url: "https://news.hada.io/rss/news",
     tags: "ai,news,korea,community", interval_sec: 3600}
  - {kind: rss, name: "Simon Willison's Weblog", url: "https://simonwillison.net/atom/everything/",
     tags: "ai,practitioner,llm", interval_sec: 21600}

  # ══════════════ ML — 연구 · 학습기법 · 도구 (15) ══════════════

  # ── 연구 블로그 (논문과 실무 사이) ──
  - {kind: rss, name: "Hugging Face Blog", url: "https://huggingface.co/blog/feed.xml",
     tags: "ml,hub,practice", interval_sec: 21600}
  - {kind: rss, name: "Google Research Blog", url: "https://research.google/blog/rss/",
     tags: "ml,research,google", interval_sec: 21600}
  - {kind: rss, name: "BAIR (Berkeley AI Research)", url: "https://bair.berkeley.edu/blog/feed.xml",
     tags: "ml,research,academia", interval_sec: 21600}
  - {kind: rss, name: "Microsoft Research", url: "https://www.microsoft.com/en-us/measure/findings/feed/",
     tags: "ml,research,microsoft", interval_sec: 21600}

  # ── 논문 (arXiv). 갈래가 겹치지 않게 고른다 ──
  - {kind: arxiv, name: "arXiv cs.CL (자연어처리)", url: "cat:cs.CL", tags: "ml,paper,nlp",
     interval_sec: 21600, respect_robots: false}
  - {kind: arxiv, name: "arXiv cs.LG (기계학습)", url: "cat:cs.LG", tags: "ml,paper,learning",
     interval_sec: 21600, respect_robots: false}
  - {kind: arxiv, name: "arXiv cs.CV (컴퓨터비전)", url: "cat:cs.CV", tags: "ml,paper,vision",
     interval_sec: 21600, respect_robots: false}
  - {kind: arxiv, name: "arXiv cs.RO (로보틱스)", url: "cat:cs.RO", tags: "ml,paper,robotics",
     interval_sec: 21600, respect_robots: false}
  - {kind: arxiv, name: "arXiv eess.AS (음성처리)", url: "cat:eess.AS", tags: "ml,paper,speech",
     interval_sec: 21600, respect_robots: false}
  - {kind: arxiv, name: "arXiv cs.IR (정보검색·RAG)", url: "cat:cs.IR", tags: "ml,paper,retrieval,rag",
     interval_sec: 21600, respect_robots: false}
  # ★ 아래 둘은 2026-08-23 검증 시 arXiv 가 "Rate exceeded" 로 응답해 **미검증**이다.
  #   쿼리 형식은 위 6개와 같으므로 동작할 것으로 보지만, 첫 수집 로그로 확인할 것.
  - {kind: arxiv, name: "arXiv cs.DC (분산·병렬 시스템)", url: "cat:cs.DC", tags: "ml,paper,systems",
     interval_sec: 21600, respect_robots: false}
  - {kind: arxiv, name: "arXiv cs.NE (신경망 구조·진화)", url: "cat:cs.NE", tags: "ml,paper,architecture",
     interval_sec: 21600, respect_robots: false}

  # ── 도구·프레임워크 (기법이 코드로 내려오는 지점) ──
  - {kind: atom, name: "PyTorch 릴리스", url: "https://github.com/pytorch/pytorch/releases.atom",
     tags: "ml,framework,training", interval_sec: 21600}
  - {kind: atom, name: "Transformers 릴리스", url: "https://github.com/huggingface/transformers/releases.atom",
     tags: "ml,framework,models", interval_sec: 21600}
  - {kind: atom, name: "Qdrant 릴리스 (벡터DB)", url: "https://github.com/qdrant/qdrant/releases.atom",
     tags: "ml,vector,retrieval,rag", interval_sec: 21600}

  # ══════════════ 껐지만 남겨 두는 것 ══════════════
  # 지우지 않고 enabled: false 로 둔다 — 지우면 DB 행이 살아 계속 수집된다.
  # 이미 모은 문서는 그대로 검색된다.
  - {kind: rss, name: "NVIDIA Blog (일반)", url: "https://blogs.nvidia.com/feed/",
     tags: "ai,vendor", interval_sec: 21600, enabled: false}
  - {kind: rss, name: "Google AI Blog (구)", url: "https://blog.google/technology/ai/rss/",
     tags: "ml,research", interval_sec: 21600, enabled: false}
  # ★ 같은 블로그의 옛 주소. DB 에 이 URL 로 21건이 들어 있어서, 이 줄이 없으면
  #   목록에서 사라진 채로 계속 수집된다 (load_sources 가 upsert 라서).
  - {kind: rss, name: "Google AI Blog (옛 주소)", url: "https://blog.google/innovation-and-ai/technology/ai/rss/",
     tags: "ml,research", interval_sec: 21600, enabled: false}
  - {kind: rss, name: "GitHub Blog Changelog", url: "https://github.blog/changelog/feed/",
     tags: "dev,changelog", interval_sec: 21600, enabled: false}
