# Life Trainer 설정 예시.
#   cp config/lifetrainer.example.toml config/lifetrainer.toml
# 실제 파일(config/lifetrainer.toml)은 git 에 올리지 않는다 — 토큰이 들어갈 수 있다.
#
# 우선순위: 환경변수 LT_* > config/lifetrainer.toml > 이 기본값

[general]
timezone  = "Asia/Seoul"
data_dir  = "data"                        # 상대 경로는 프로젝트 루트 기준
db_path   = "data/lifetrainer.db"
log_level = "INFO"

[activitywatch]
# PC(Windows) 의 aw-server. Tailscale 주소를 쓴다.
base_url          = "http://100.64.0.3:35600"
# aw-server v0.14.0b1+ 의 [auth] api_key. 비-loopback 바인드에서는 반드시 설정할 것
# (비-loopback 이면 Host 헤더 검사가 조용히 꺼진다 — docs/research/activitywatch.md §4)
api_key           = ""
timeout_sec       = 10
poll_interval_sec = 600
# 재폴링 시 되감는 구간. 버킷의 마지막 이벤트는 하트비트라 duration 이 계속 자란다.
# 이 값보다 짧은 주기로 폴링하면서 upsert 하면 이중 계산이 생기지 않는다.
overlap_sec       = 900
backfill_days     = 7
hosts             = []                    # 비우면 모든 호스트

[rollup]
slot_minutes      = 10                    # 하루 144 슬롯
afk_category      = "away"
no_data_category  = "off"
# 슬롯 총 600초 중 관측된 활동이 이 비율 미만이면 off 로 본다.
min_active_ratio  = 0.05
rules_path        = "config/rules.yaml"

# 기기 전환을 별도 활동으로 남길 최소 길이(초). 짧으면 앞 활동에 흡수한다.
switch_absorb_sec = 300

# 논리적 하루가 시작하는 시각. 06:00 이면 새벽 2시는 **전날**이다.
# ★ `timeutil.*` 의 boundary_hour 기본값과 반드시 같아야 한다 —
#   다르면 슬롯 좌표가 조용히 어긋난다.
day_boundary_hour = 6

[report]
png_dir     = "data/png"
font_family = "NanumGothic"               # 한글 깨짐 방지
daily_at    = "23:30"
weekly_at   = "22:00"                     # 일요일
morning_at  = "07:30"

[slack]
# notify = 발송 전용 (기존 OpenClaw 봇 토큰 재사용, 슬래시 커맨드 없음)
# bolt   = 전용 앱 (Socket Mode, 슬래시 커맨드 사용)
mode            = "notify"
bot_token       = ""                      # 비우면 openclaw_config 에서 읽는다
app_token       = ""                      # bolt 모드에서만 필요
default_channel = ""                      # 채널 ID(C…) 또는 DM 상대 user ID(U…)
openclaw_config = "/home/user/.openclaw/openclaw.json"

[llm]
base_url         = "http://127.0.0.1:8080/v1"
model            = "qwen3-8b"
timeout_sec      = 300
# 실측: 깊이 3~5K 가 처리량 최적 구간. 그 이상은 생성 속도가 급락한다.
max_input_tokens = 4000
enable_thinking  = false                  # JSON 출력 시 반드시 false

[collect]
user_agent                  = "LifeTrainer/0.1 (+https://github.com/; personal research bot)"
per_domain_min_interval_sec = 2.0
per_domain_concurrency      = 1
arxiv_min_interval_sec      = 3.0
max_fail_before_disable     = 10
sources_path                = "config/sources.yaml"
respect_robots              = true

[nightly]
# 야간 배치(lifetrainer-nightly.timer, 02:00)가 한 번에 큐에 넣는 양.
#
# 실측 22.2초/건이라 새벽 창(02:00~05:50)의 물리적 상한이 약 600건이다.
#
# ★ **30 이다** (2026-09-07 에 600 에서 내렸다). 코드 기본값 · 이 파일 · 실제 운영값이
#    이제 모두 같다 — 전에는 코드와 이 파일이 600, 운영이 30 이라 **새 기기가
#    이 저장소가 이미 접은 동작으로 돌 참이었다.**
#    600 은 *"새벽 창(02:00~05:50)에 물리적으로 넣을 수 있는 최대"* 였지
#    *"사람이 하루에 읽는 양"* 이 아니었다 (600 → 60 → 30).
#    요약 대상은 score 상위부터 고르므로 관심사에 가까운 것이 먼저 요약된다.
#    **검색은 이 값과 무관하다** — 임베딩은 요약 여부와 상관없이 모든 문서에 붙는다.
#    ★ 30 은 **이 기기 한 대에서 잰 값**이다. 남은 몫은
#      docs/issues/p-0005-the-default-is-a-number-measured-on-one-machine.md 에.
summary_limit = 30
# 하룻밤에 임베딩할 문서 수. **요약 한도와 묶지 않는다** — 요약은 GPU 22초/건,
# 임베딩은 CPU 1초 미만/건이다. 문서 유입(하루 수백 건)보다 커야 밀리지 않는다.
embed_limit = 1000

# 종료된 잡(done/failed/cancelled)을 며칠 뒤에 걷어내나. `lt nightly --stop` 이 05:50 에
# 하루 한 번 지운다. 0 이면 안 지운다.
#
# ★ 2026-09-01 까지 이 정리는 **한 번도 돌지 않았다.** `purge_done` 은 만들어져 있었지만
#    호출자가 없었고, `lt doctor` 주석만 "14일 뒤에 걷어간다"고 적고 있었다.
job_retention_days = 14
tag_limit     = 20                        # 미분류 상위 N개를 한 번의 호출로 묶어 태깅

[embed]
# 문서 임베딩 (RAG 하이브리드 검색). 대화 모델(:8080)과 **다른 프로세스**이고
# CPU 추론(-ngl 0)이라 8B 와 코어를 다툰다.
#
# 꺼도 검색은 안 죽는다 — 키워드(FTS5)만으로 순위가 매겨진다.
enabled        = false
base_url       = "http://127.0.0.1:8081/v1"
model          = "qwen3-embedding-0.6b"
dim            = 1024

# ★ 질의에는 지시문 접두를 붙여야 한다. 안 붙였을 때 하이브리드 hit@5 가 76% 로
#   키워드 단독(96%)보다 **나빴다.** 붙인 뒤 98% (2026-08-23 실측 20질의).
query_instruct = "Instruct: Given a search query, retrieve relevant articles\nQuery:"

# ★ 재색인 속도를 좌우한다 (2026-08-23 실측, 문서 4,435건 기준):
#     batch=  4    ~3 doc/s   →  24.6분
#     batch= 16     9.0 doc/s →   8.2분
#     batch= 64    25.8 doc/s →   2.9분
#   청킹 전략을 바꿔가며 재색인할 계획이면 올려 둘 값이다.
#   이 기기의 운영값은 **4** 다 (8B 와 코어를 덜 다투게 낮춰 둔 것).
batch_size     = 16
timeout_sec    = 30.0
max_chars      = 1600

# 하이브리드 순위에서 벡터 점수의 비중. **근거 없이 정한 값이다** —
# 재 보고 정할 것 (docs/rag-plan.md).
vector_weight  = 0.5


[private]
# 프라이빗 모드 — 그 시간을 아예 안 재게 한다.
# 켜는 동안 창 제목·앱 이름이 `aw_event` 에 **한 줄도 안 들어간다**
# (저장 관문이 `collect/aw_sync.upsert_events` 에 있다).
default_minutes   = 60      # 인자 없이 켰을 때의 길이
max_minutes       = 480     # 한 번에 걸 수 있는 상한
max_purge_minutes = 240     # "방금 N분 지우기" 의 상한

# PC 헬퍼·폰 타일이 `GET /ingest/private` 를 물어보는 주기(초).
# 이 값이 곧 **워처가 멈추기까지의 최대 지연**이다.
poll_sec          = 15

# 소급 삭제 때 엔드포인트의 **AW 로컬 DB 에서도** 지울지.
# ★ 남의 기기 데이터라 기본이 꺼짐이다. 실패해도 전체를 실패시키지 않는다 —
#   젯슨 DB 차단은 그것과 무관하게 이미 성립한다.
purge_aw          = false


[search]
# 대화가 주소를 모를 때 쓰는 웹 검색. **공급자는 Serper 하나**이고, 한국어 질의는
# gl=kr&hl=ko 를 붙여 같은 곳으로 보낸다.
#
#   Serper  https://serper.dev  가입 시 2,500건(6개월). 구글 결과를 JSON 으로.
#   네이버  ✗ 코드에서 지웠다 (2026-08-25). 검색 API 가 NAVER API HUB 로 이관되고
#           개발자센터 신규 신청이 2026-07-31 에 닫혀 키를 못 받는다 — §4
#   구글    ✗ Custom Search JSON API 신규 가입 종료 (2026-08-19 확인) — §1
#
# 키가 없어도 나머지 기능은 그대로 돌아간다 (lt doctor 가 WARN 으로 알려준다).
serper_api_key      = ""
timeout_sec         = 10.0
max_results         = 5

# ─────────────────────────────────────────────────────────────────────────────
# 플래너 웹 서버 (lifetrainer-web.service 가 상시 띄운다)
#
# host  기본 127.0.0.1. tailnet 에서 열려면 "0.0.0.0" 으로 두고 Tailscale 을
#       1차 경계로 쓴다. 공개 인터넷에 직접 노출하지 않는다.
# port  8770
#
# external = true 면 응답에서 **창 제목·앱 이름을 제거**한다 (실측 22KB→13KB).
#   폰에서 바깥 경로로 열 때를 위한 마스킹이다. 카테고리와 시간만 남는다.
#
# session_secret 을 비워 두면 <data_dir>/websecret 에 무작위 키를 0600 으로 만들어
#   쓴다. HMAC 원타임 링크(link_ttl_sec)로 들어와 세션(session_ttl_sec)을 받는다.
#   ★ [ingest].secret 과 **일부러 분리돼 있다** — 아래 주석 참조.
#
# read_only = true 면 계획 CRUD·칸 보정이 전부 막힌다 (조회 전용).
[web]
host            = "127.0.0.1"
port            = 8770
base_url        = ""
read_only       = false
session_secret  = ""
link_ttl_sec    = 600
session_ttl_sec = 2592000
external        = false

# ↓ external = true 일 때만 의미가 있다.
external_host   = ""            # 터널이 붙는 호스트명. 비면 요청 Host 를 쓴다
url_prefix      = ""            # 앱을 하위 경로에 mount 한다 (예: "/planner").
                                # 이 저장소는 "/planner" 로 돌린다 — 터널에서 경로 하나만
                                # 열어 두고 나머지를 404 로 막기 위해서다
external_mask   = true          # 외부 응답에서 창 제목·앱 이름을 지운다 (실측 22KB→13KB, 누출 0)
# ★ 이 기기의 운영값은 external_mask = false 다. 플래너를 아직 공개 인터넷에 안 열었고
#   (`/ingest/` 만 열려 있다) 로컬·tailnet 에서만 보기 때문이다.
#   **플래너를 여는 순간 반드시 true 로 되돌릴 것.**

# 폰이 밀어 넣는 수신 엔드포인트 (POST /ingest/aw).
#
# ★ 기본이 꺼짐이다. 이 앱에서 **공개 인터넷(Cloudflare Tunnel)으로 열리는 유일한
#   경로**라, 켜는 것이 명시적인 행위여야 한다.
#
# secret 을 비워 두면 <data_dir>/ingestsecret 에 무작위 키를 0600 으로 만들어 쓴다.
# **web.session_secret 과 일부러 분리했다** — 폰이 들고 있는 값이라 새더라도
# 플래너 세션까지 열려서는 안 된다. 폰에는 이 값을 넣는다.
#
# 인증은 본문에 묶인 HMAC 서명이다:
#   Authorization: LT1 <기기>:<epoch초>:<nonce>:<서명>
#   서명 = b64url(HMAC-SHA256(secret, "<기기>\n<epoch초>\n<nonce>\n<sha256(본문) hex>"))
# clock_skew_sec 밖의 요청과 이미 쓴 nonce 는 거절된다.
#
# 네트워크 경로는 **이미 등록된 기기만** 받는다. 첫 등록은 로컬에서:
#   lt import --from <adb 로 뽑은 export.json> --device phone-example
[ingest]
enabled        = false
secret         = ""
max_body_bytes = 4194304
clock_skew_sec = 300
