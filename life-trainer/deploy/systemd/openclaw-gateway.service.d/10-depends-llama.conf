# openclaw-gateway 가 모델 백엔드에 의존하도록 묶는다.
#
# 드롭인으로 둔 이유: openclaw-gateway.service 본체는 `openclaw daemon install`
# 이 다시 생성하며 덮어쓴다. 드롭인은 살아남는다.
#
# Requires= 는 llama-server 가 죽으면 게이트웨이도 같이 내린다.
# 게이트웨이만 살아 있으면 모든 에이전트 턴이 조용히 실패하므로 Wants= 보다 낫다.
[Unit]
Requires=llama-server.service
After=llama-server.service
