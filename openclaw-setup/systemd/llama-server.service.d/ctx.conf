# KV 캐시 축소 — 2026-08-23
#
# -c 40960 은 Qwen3-8B 의 n_ctx_train 상한이었지 "필요한 값" 이 아니었다.
# KV(q8_0) 는 토큰당 76.5 KiB 라 40,960 이면 2.99GB 를 시동 시 전액 선불한다.
#
# 실측: Life Trainer 한 턴이 최악 2,980 토큰 (시스템 525 + 배경 96 + 툴스키마 517
#       + 히스토리 6개 + 툴결과 3라운드). MAX_HISTORY_MESSAGES=6 으로 상한이
#       구조적으로 걸려 있어 이 값이 늘어날 길이 없다.
# 20,480 = 그 6.9배. 동시에 OpenClaw 압축 설정(0.7 share + reserve 6000)이
#       재계산 없이 성립하는 하한이기도 하다 → 14,336 + 6,000 = 20,336 < 20,480.
#
# 회수: KV 2.99GB → 1.50GB
# 되돌리기: 이 파일을 지우고 systemctl --user daemon-reload && restart llama-server
[Service]
Environment=LLAMA_CTX=20480
