# 게이트웨이 서비스의 PATH 에서 버전 매니저 경로를 걷어낸다.
#
# ExecStart 는 여기서 건드리지 않는다. /usr/local/bin/node 가 설치된 뒤
# `openclaw gateway install --force` 로 유닛을 다시 생성하면 본체가 알아서
# 시스템 Node 를 가리킨다 (install-system-node.sh → use-system-node.sh 순서).
# 드롭인에 ExecStart 를 중복으로 박아두면 openclaw 재설치로 dist 경로가 바뀔 때
# 드롭인 쪽 하드코딩이 유닛을 깨뜨린다.
#
# PATH 만 남기는 이유: 유닛 본체가 생성하는 PATH 에는 nvm 디렉토리가 계속 섞인다.
# 이건 openclaw 가 config 로 조절할 수단을 주지 않아 드롭인 말고는 방법이 없다.
[Service]
Environment=PATH=/usr/local/bin:/usr/bin:/bin:/home/user/.local/bin
