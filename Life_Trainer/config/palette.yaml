# Life Trainer 색상 단일 원본
#
# 웹 플래너(CSS)와 타임라인 PNG(matplotlib)가 **이 파일 하나**를 읽는다.
# 두 곳에 색을 따로 적어두면 반드시 갈라진다.
#
# ── 이 값들이 어디서 왔는가 ──────────────────────────────────
# dataviz 스킬의 검증된 기본 팔레트(8슬롯 범주형)를 그대로 가져왔다.
# 임의로 고른 색이 아니다. 처음에 내가 눈대중으로 고른 Tailwind 색은
# 검증기에서 3개 항목이 FAIL 했다:
#
#   [FAIL] 채도 하한      #94a3b8 이 회색으로 읽힘 (구조색과 충돌)
#   [FAIL] CVD 분리       coding↔research ΔE 1.3 (적록색약)
#   [FAIL] 정상시야 하한   coding↔research ΔE 12.0  ← 색각 정상인 사람도 구분 못 함
#
# coding 과 research 는 이 시스템에서 가장 자주 나오는 두 카테고리다.
# 그 둘이 구분이 안 되면 타임라인 전체가 무의미해진다.
#
# ── 검증 결과 (scripts/validate_palette.js) ─────────────────
#   라이트 adjacent : 전 항목 PASS (최악 CVD ΔE 9.1 / 정상시야 19.6)
#   다크   adjacent : 전 항목 PASS, 경고 없음
#   라이트 all-pairs: research(주황)↔ops(초록), research↔entertainment(빨강) 실패
#
# all-pairs 가 실패하므로 **2차 인코딩이 필수다.** 색만으로 정체를 전달하면 안 된다:
#   - 범례를 항상 띄운다
#   - 3칸(30분) 이상 연속된 블록에는 카테고리 이름을 직접 적는다
#   - 웹에서는 칸에 hover/tap 시 카테고리명을 노출한다
# 이 규칙을 어기면 위 실패 쌍이 실제 혼동으로 나타난다.
#
# 색을 바꾸고 싶으면 반드시 검증기를 다시 돌릴 것:
#   node <dataviz>/scripts/validate_palette.js "<hex,...>" --mode light
#
# 라이트 모드에서 aqua/yellow/magenta 는 표면 대비가 3:1 미만이라
# (검증기 WARN) 텍스트 라벨이 반드시 함께 있어야 한다. 위 2차 인코딩 규칙이 이걸 겸한다.
#
# ── ★ 9번째 슬롯 gaming (2026-08-19 추가) ────────────────────
# dataviz 스킬의 기본 팔레트는 **8슬롯이 전부다.** "9번째 계열색은 만들지 말고
# Other 로 접어라"가 스킬의 명시적 규칙이다. 그런데 활동 카테고리는 계열(series)이
# 아니라 격자 한 칸의 정체라 "기타"로 접을 수가 없다 — 칸은 반드시 무언가로 칠해진다.
#
# 그래서 눈대중으로 고르는 대신 **OKLCH 공간을 전수 탐색했다**: 색상 6°, 명도 4단,
# 채도 5단(= 후보 1,800개)을 돌려 기존 8색 **전부와의** 최소 ΔE 를 계산하고,
# 검증기의 하드 게이트(명도대·채도하한)를 통과하는 것만 남겼다. 라이트에서 42개가
# 살아남았고, 그중 다크 대응색까지 함께 통과하는 조합을 골랐다.
#
#   라이트 #8f2165  기존 8색 대비 최악 CVD ΔE 11.4 (vs browsing) · 정상시야 17.4
#   다크   #974dad  기존 8색 대비 최악 CVD ΔE  9.0 (vs coding)   · 정상시야 14.2
#   9색 adjacent 검증: light PASS / dark PASS (명도대·채도·CVD·정상시야 전항목)
#
# ★ 이 수치는 **adjacent 가 아니라 8색 전부와의 최악값**이다. 기존 8색끼리도
#   all-pairs 로 재면 CVD 1.6 / 정상시야 7.1 인 쌍이 있다(다크). 즉 새 색은
#   기존 팔레트가 자기들끼리 유지하는 것보다 더 멀리 떨어져 있다.
#   그래도 all-pairs 실패 쌍은 여전히 남아 있으므로 2차 인코딩 규칙은 그대로 적용된다.
#
#   재현: node <dataviz>/scripts/validate_palette.js \
#           "#2a78d6,#eb6834,#1baf7a,#eda100,#e87ba4,#008300,#4a3aa7,#e34948,#8f2165" --mode light

version: 1

surface:
  light: "#fcfcfb"
  dark:  "#1a1a19"

ink:
  primary:   {light: "#0b0b0b", dark: "#ffffff"}
  secondary: {light: "#52514e", dark: "#c3c2b7"}
  muted:     {light: "#898781", dark: "#898781"}
  gridline:  {light: "#e1e0d9", dark: "#2c2c2a"}
  baseline:  {light: "#c3c2b7", dark: "#383835"}

# 활동 카테고리 — 고정 순서. 절대 순환 배정하지 않는다.
# 슬롯 1~3 이 all-pairs 까지 통과하므로 가장 자주 나오는 카테고리에 배정했다.
categories:
  coding:        {slot: 1, hue: blue,    light: "#2a78d6", dark: "#3987e5", label: 코딩}
  research:      {slot: 2, hue: orange,  light: "#eb6834", dark: "#d95926", label: 리서치}
  writing:       {slot: 3, hue: aqua,    light: "#1baf7a", dark: "#199e70", label: 문서}
  sns:           {slot: 4, hue: yellow,  light: "#eda100", dark: "#c98500", label: SNS}
  learning:      {slot: 5, hue: magenta, light: "#e87ba4", dark: "#d55181", label: 학습}
  ops:           {slot: 6, hue: green,   light: "#008300", dark: "#008300", label: 운영}
  browsing:      {slot: 7, hue: violet,  light: "#4a3aa7", dark: "#9085e9", label: 웹}
  entertainment: {slot: 8, hue: red,     light: "#e34948", dark: "#e66767", label: 여가}
  gaming:        {slot: 9, hue: berry,   light: "#8f2165", dark: "#974dad", label: 게임}

# 구조 상태 — 활동이 아니다. 범주형 색을 쓰면 안 된다.
# 종이 플래너의 빈 칸이 흰색이듯, off 는 표면에 가깝게 둬서
# "채워진 곳"이 도드라지게 한다.
structural:
  away:    {light: "#d6d5cc", dark: "#35352f", label: 자리비움}
  "off":   {light: "#f2f1ec", dark: "#222221", label: 빈칸}
  unknown: {light: "#898781", dark: "#898781", label: 미분류}

# 계획 오버레이 — 실제(채움) 위에 겹치는 층.
# apple-design §12(반투명으로 위계 전달): 계획은 아직 일어나지 않은 것이므로
# 실제보다 물러나 있어야 한다. 테두리와 옅은 washes 로만 표현한다.
plan_overlay:
  stroke:      {light: "#0b0b0b", dark: "#ffffff"}
  stroke_alpha: 0.38
  wash_alpha:   0.10
  achieved:    {light: "#006300", dark: "#0ca30c"}   # 달성 표시 (성공 텍스트색)
  missed:      {light: "#898781", dark: "#898781"}

# ── 팔레트 변주 (2026-08-25) ─────────────────────────────────────────────
#
# 위 `categories` 가 기본이고, 아래는 **같은 hue 를 유지한 채** 명도·채도만 옮긴
# 변주다. hue 가 곧 카테고리의 정체라서 테마를 바꿔도 "파랑은 코딩"이 유지된다.
#
# ★ 눈대중이 아니다. `scripts/derive_theme_palette.py` 가 OKLCH 격자를 전수 탐색해
#   게이트(adjacent >= 9 · all-pairs >= 2.5 · 표면 대비 >= 12)를 통과하는 것 중
#   테마의 의도(파스텔=가장 연하게 / 네온=가장 진하게)에 맞는 조합을 고른다.
#
#   기본     adjacent 19.6/19.3 · all-pairs 7.1/7.1 · 표면 27.7/35.9
#   pastel   adjacent 12.0/10.6 · all-pairs 2.6/2.5 · 표면 12.6/60.5
#   neon     adjacent 20.8/23.1 · all-pairs 5.2/5.0 · 표면 25.4/48.7
#
# ★ **all-pairs 는 기본(7.1)보다 나쁘다.** 특히 파스텔은 2.6 이다 — 처음에 4.0 을
#   걸었더니 파스텔은 어떤 조합도 통과하지 못했다. hue 를 유지한 채 채도를 낮추면
#   최악 쌍이 함께 눌리는 것이 원리적이다. 기본 팔레트도 all-pairs 는 실패해서
#   2차 인코딩(3칸 이상 블록의 이름 · 상시 범례)에 기대고 있는데, 변주에서는
#   그 의존도가 더 크다. 라벨을 끄면 안 된다.
#
#   재현: .venv/bin/python scripts/derive_theme_palette.py
themes:
  pastel:
    light:
      coding:         "#a7e2ff"
      research:       "#ffa681"
      writing:        "#9bf4c9"
      sns:            "#f2b965"
      learning:       "#ffc1de"
      ops:            "#8fda88"
      browsing:       "#d3d3ff"
      entertainment:  "#ff9d95"
      gaming:         "#ffbded"
    dark:
      coding:         "#bee1ff"
      research:       "#f1b49e"
      writing:        "#bcebd3"
      sns:            "#debe96"
      learning:       "#ffc9db"
      ops:            "#a6d2a2"
      browsing:       "#dad8ff"
      entertainment:  "#efb2af"
      gaming:         "#f3d0fe"
  neon:
    light:
      coding:         "#23bdff"
      research:       "#ff4b00"
      writing:        "#00eb93"
      sns:            "#ff8900"
      learning:       "#ff75c2"
      ops:            "#00d600"
      browsing:       "#b29cff"
      entertainment:  "#ff0039"
      gaming:         "#ff69de"
    dark:
      coding:         "#0098ff"
      research:       "#ff3500"
      writing:        "#00c378"
      sns:            "#ef7e00"
      learning:       "#ff1d95"
      ops:            "#00c500"
      browsing:       "#9a7dff"
      entertainment:  "#ff384f"
      gaming:         "#dd58ff"
