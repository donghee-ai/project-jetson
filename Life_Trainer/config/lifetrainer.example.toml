# Life Trainer 설정 예시.
#   cp config/lifetrainer.example.toml config/lifetrainer.toml
# 실제 파일(config/lifetrainer.toml)은 git 에 올리지 않는다 — 토큰이 들어갈 수 있다.
#
# 우선순위: 환경변수 LT_* > config/lifetrainer.toml > 이 기본값

[general]
timezone  = "Asia/Seoul"
data_dir  = "data"                        # 상대 경로는 프로젝트 루트 기준
db_path   = "data/lifetrainer.db"
log_level = "INFO"

[activitywatch]
# PC(Windows) 의 aw-server. Tailscale 주소를 쓴다.
base_url          = "http://100.64.0.3:5600"
# aw-server v0.14.0b1+ 의 [auth] api_key. 비-loopback 바인드에서는 반드시 설정할 것
# (비-loopback 이면 Host 헤더 검사가 조용히 꺼진다 — docs/research/activitywatch.md §4)
api_key           = ""
timeout_sec       = 10
poll_interval_sec = 600
# 재폴링 시 되감는 구간. 버킷의 마지막 이벤트는 하트비트라 duration 이 계속 자란다.
# 이 값보다 짧은 주기로 폴링하면서 upsert 하면 이중 계산이 생기지 않는다.
overlap_sec       = 900
backfill_days     = 7
hosts             = []                    # 비우면 모든 호스트

[rollup]
slot_minutes      = 10                    # 하루 144 슬롯
afk_category      = "away"
no_data_category  = "off"
# 슬롯 총 600초 중 관측된 활동이 이 비율 미만이면 off 로 본다.
min_active_ratio  = 0.05
rules_path        = "config/rules.yaml"

# 기기 전환을 별도 활동으로 남길 최소 길이(초). 짧으면 앞 활동에 흡수한다.
switch_absorb_sec = 300

[report]
png_dir     = "data/png"
font_family = "NanumGothic"               # 한글 깨짐 방지
daily_at    = "23:30"
weekly_at   = "22:00"                     # 일요일
morning_at  = "07:30"

[slack]
# notify = 발송 전용 (기존 OpenClaw 봇 토큰 재사용, 슬래시 커맨드 없음)
# bolt   = 전용 앱 (Socket Mode, 슬래시 커맨드 사용)
mode            = "notify"
bot_token       = ""                      # 비우면 openclaw_config 에서 읽는다
app_token       = ""                      # bolt 모드에서만 필요
default_channel = ""                      # 채널 ID(C…) 또는 DM 상대 user ID(U…)
openclaw_config = "/home/user/.openclaw/openclaw.json"

[llm]
base_url         = "http://127.0.0.1:8080/v1"
model            = "qwen3-8b"
timeout_sec      = 300
# 실측: 깊이 3~5K 가 처리량 최적 구간. 그 이상은 생성 속도가 급락한다.
max_input_tokens = 4000
enable_thinking  = false                  # JSON 출력 시 반드시 false

[collect]
user_agent                  = "LifeTrainer/0.1 (+https://github.com/; personal research bot)"
per_domain_min_interval_sec = 2.0
per_domain_concurrency      = 1
arxiv_min_interval_sec      = 3.0
max_fail_before_disable     = 10
sources_path                = "config/sources.yaml"
respect_robots              = true

[nightly]
# 야간 배치(lifetrainer-nightly.timer, 02:00)가 한 번에 큐에 넣는 양.
# 실측 22.2초/건이므로 새벽 창 02:00~06:00(4시간)은 약 700건이 상한이다.
# 600건 ≈ 3.3시간이라 중단 타이머(05:50)에 걸리기 전에 끝난다.
summary_limit = 600
tag_limit     = 20                        # 미분류 상위 N개를 한 번의 호출로 묶어 태깅

[search]
# 대화가 주소를 모를 때 쓰는 웹 검색. **한국어는 네이버, 그 외는 Serper** 로 나눈다.
# 구글 Custom Search JSON API 는 신규 가입이 닫혔다 (2026-08-19 확인) —
# 근거와 대안 비교는 docs/known-issues.md §1.
#
#   네이버  https://developers.naver.com → 애플리케이션 등록 → 검색 API
#           하루 25,000건 무료. 국내 사이트·한국어 고유명사에 강하다
#   Serper  https://serper.dev  가입 시 2,500건(6개월). 구글 결과를 JSON 으로
#
# 키가 없어도 나머지 기능은 그대로 돌아간다 (lt doctor 가 WARN 으로 알려준다).
naver_client_id     = ""
naver_client_secret = ""
serper_api_key      = ""
timeout_sec         = 10.0
max_results         = 5

# ─────────────────────────────────────────────────────────────────────────────
# 플래너 웹 서버 (lifetrainer-web.service 가 상시 띄운다)
#
# host  기본 127.0.0.1. tailnet 에서 열려면 "0.0.0.0" 으로 두고 Tailscale 을
#       1차 경계로 쓴다. 공개 인터넷에 직접 노출하지 않는다.
# port  8770
#
# external = true 면 응답에서 **창 제목·앱 이름을 제거**한다 (실측 22KB→13KB).
#   폰에서 바깥 경로로 열 때를 위한 마스킹이다. 카테고리와 시간만 남는다.
#
# session_secret 을 비워 두면 <data_dir>/websecret 에 무작위 키를 0600 으로 만들어
#   쓴다. HMAC 원타임 링크(link_ttl_sec)로 들어와 세션(session_ttl_sec)을 받는다.
#   ★ [ingest].secret 과 **일부러 분리돼 있다** — 아래 주석 참조.
#
# read_only = true 면 계획 CRUD·칸 보정이 전부 막힌다 (조회 전용).
[web]
host            = "127.0.0.1"
port            = 8770
base_url        = ""
read_only       = false
session_secret  = ""
link_ttl_sec    = 600
session_ttl_sec = 2592000
external        = false


# 폰이 밀어 넣는 수신 엔드포인트 (POST /ingest/aw).
#
# ★ 기본이 꺼짐이다. 이 앱에서 **공개 인터넷(Cloudflare Tunnel)으로 열리는 유일한
#   경로**라, 켜는 것이 명시적인 행위여야 한다.
#
# secret 을 비워 두면 <data_dir>/ingestsecret 에 무작위 키를 0600 으로 만들어 쓴다.
# **web.session_secret 과 일부러 분리했다** — 폰이 들고 있는 값이라 새더라도
# 플래너 세션까지 열려서는 안 된다. 폰에는 이 값을 넣는다.
#
# 인증은 본문에 묶인 HMAC 서명이다:
#   Authorization: LT1 <기기>:<epoch초>:<nonce>:<서명>
#   서명 = b64url(HMAC-SHA256(secret, "<기기>\n<epoch초>\n<nonce>\n<sha256(본문) hex>"))
# clock_skew_sec 밖의 요청과 이미 쓴 nonce 는 거절된다.
#
# 네트워크 경로는 **이미 등록된 기기만** 받는다. 첫 등록은 로컬에서:
#   lt import --from <adb 로 뽑은 export.json> --device phone-example
[ingest]
enabled        = false
secret         = ""
max_body_bytes = 4194304
clock_skew_sec = 300
