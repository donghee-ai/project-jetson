[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifetrainer"
version = "0.1.0"
description = "On-device personal life-logging agent for Jetson Orin NX"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
    "matplotlib>=3.8",
    "feedparser>=6.0",
    "pydantic>=2.9",
    "slack-bolt>=1.20",
    "slack-sdk>=3.33",
    # ★ 아래 넷은 코드가 쓰는데 선언이 빠져 있었다 (2026-08-28, CI 가 잡음).
    #   로컬 .venv 에 깔려 있어서 여기서는 안 보였다 — 새 환경에서만 드러난다.
    "flask>=3.0",          # web/app.py
    "werkzeug>=3.0",       # web/app.py — flask 가 끌고 오지만 직접 import 한다
    "numpy>=1.24",         # llm/embed.py
    "tomli>=2.0; python_version < '3.11'",   # config.py — 3.11+ 는 표준 tomllib
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[project.scripts]
lt = "lifetrainer.cli:main"

[tool.setuptools.packages.find]
include = ["lifetrainer*"]

[tool.setuptools.package-data]
lifetrainer = ["schema.sql", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
