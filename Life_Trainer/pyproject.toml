[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifetrainer"
version = "0.1.0"
description = "On-device personal life-logging agent for Jetson Orin NX"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
    "matplotlib>=3.8",
    "feedparser>=6.0",
    "pydantic>=2.9",
    "slack-bolt>=1.20",
    "slack-sdk>=3.33",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[project.scripts]
lt = "lifetrainer.cli:main"

[tool.setuptools.packages.find]
include = ["lifetrainer*"]

[tool.setuptools.package-data]
lifetrainer = ["schema.sql", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
